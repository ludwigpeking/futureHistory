<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Last Day of AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body class="ui-hidden">
<!-- The sheet fills the window; every panel floats over it and can be hidden with the button at the top right (or the H key). Sound: the button beside it, or M. -->
<svg id="stage" role="img" aria-labelledby="stage-title"><title id="stage-title">The Last Day of AI: simulated histories replayed one after another on a single chart</title></svg>

<div class="play-overlay" id="play-overlay"><button type="button" id="play-big">Play the histories</button></div>

<div class="corner-controls">
  <button type="button" class="corner-button" id="sound-toggle" aria-pressed="true">Sound on</button>
  <button type="button" class="corner-button" id="ui-toggle" aria-controls="masthead tally bottom-stack" aria-expanded="false">Show panels</button>
</div>

<header class="floating masthead" id="masthead">
  <h1>The Last Day of AI</h1>
  <p id="masthead-text"></p>
  <details class="about">
    <summary>How to read it</summary>
    <p class="footnote" id="footnote"></p>
  </details>
</header>

<div class="floating tally-card" id="tally" aria-label="Endings so far"></div>

<div class="floating bottom-stack" id="bottom-stack">
  <div class="caption-card" id="caption" aria-live="polite">
    <div class="kicker" id="caption-kicker"></div>
    <div class="headline" id="caption-headline"></div>
    <div class="body" id="caption-body"></div>
    <div class="meta" id="caption-meta"></div>
  </div>
  <div class="transport">
    <button type="button" id="play-button">Play</button>
    <button type="button" id="previous-button">Previous history</button>
    <button type="button" id="next-button">Next history</button>
    <div class="scrub"><input type="range" id="scrubber" min="0" max="10000" value="0" aria-label="Position across all histories"></div>
    <label class="pace" for="pace">Pace <input type="range" id="pace" min="0.2" max="6" step="0.1" value="1.2"><output id="pace-value" for="pace"></output></label>
    <div class="clock" id="clock"></div>
  </div>
</div>

<script src="./story-data.js"></script>
<script src="./sound.js"></script>
<script src="./app.js"></script>
</body>
</html>
